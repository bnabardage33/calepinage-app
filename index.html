<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Calepinage Pro V2</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header class="topbar">

        <div class="logo">

            <h1>CALEPINAGE PRO</h1>

        </div>

        <nav class="menu">

            <button id="newProjectBtn">
                Nouveau
            </button>

            <button id="openProjectBtn">
                Ouvrir
            </button>

            <button id="saveProjectBtn">
                Sauvegarder
            </button>

            <span class="separator"></span>

            <button id="newFacadeBtn" class="primary">
                + Nouvelle façade
            </button>

        </nav>

    </header>

    <!-- ========================= -->
    <!-- CONTENU -->
    <!-- ========================= -->

    <div class="container">

        <!-- Barre de gauche -->

        <aside class="sidebar">

            <h2>Projet</h2>

            <button id="projectInfoBtn">
                Informations
            </button>

            <button id="facadesBtn">
                Façades
            </button>

            <button id="metrageBtn">
                Métré
            </button>

            <button id="exportBtn">
                Export
            </button>

        </aside>

        <!-- Zone de travail -->

        <main class="workspace">

            <canvas id="canvas"></canvas>

        </main>

        <!-- Propriétés -->

        <aside class="properties">

            <h2>Propriétés</h2>

            <div id="propertyContent">

                Aucun élément sélectionné.

            </div>

        </aside>

    </div>

    <!-- ========================= -->
    <!-- BARRE D'ÉTAT -->
    <!-- ========================= -->

    <footer class="statusbar">

        <span id="statusText">

            Prêt.

        </span>

    </footer>

    <!-- ========================= -->
    <!-- MODAL NOUVELLE FAÇADE -->
    <!-- ========================= -->

    <div id="facadeModal" class="modal" hidden>

        <div class="modal-content">

            <h2>Nouvelle façade</h2>

            <form id="facadeForm">

                <label>Nom</label>

                <input
                    id="facadeName"
                    type="text"
                    required>

                <label>Largeur (mm)</label>

                <input
                    id="facadeWidth"
                    type="number"
                    required>

                <label>Hauteur (mm)</label>

                <input
                    id="facadeHeight"
                    type="number"
                    required>

                <label>Type</label>

                <select id="facadeType">

                    <option>Bac acier</option>

                    <option>Panneau sandwich</option>

                    <option>Composite</option>

                </select>

                <label>Pose</label>

                <select id="facadePose">

                    <option>Verticale</option>

                    <option>Horizontale</option>

                </select>

                <div class="actions">

                    <button
                        type="button"
                        id="cancelFacade">

                        Annuler

                    </button>

                    <button
                        type="submit">

                        Créer

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->

    <script src="js/core/state.js"></script>

    <script src="js/core/storage.js"></script>

    <script src="js/canvas/camera.js"></script>

    <script src="js/canvas/grille.js"></script>

    <script src="js/canvas/canvas.js"></script>

    <script src="js/facade/facade.js"></script>

    <script src="js/facade/ouverture.js"></script>

    <script src="js/calcul/calcul.js"></script>

    <script src="js/calcul/metrage.js"></script>

    <script src="js/export/pdf.js"></script>

    <script src="js/export/csv.js"></script>

    <script src="js/ui/dashboard.js"></script>

    <script src="js/ui/modal.js"></script>

    <script src="js/ui/notifications.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
